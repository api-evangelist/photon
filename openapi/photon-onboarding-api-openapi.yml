  /api/onboarding/sessions:
    post:
      tags:
      - Onboarding
      operationId: createOrResumeOnboardingSession
      summary: Create or resume an onboarding session
      description: Creates a local-only session until valid contact details identify the lead. A prior lead token may be supplied in the `x-onboarding-lead-token` header, cookie, or request body. A submitted session can also be resumed from Attio with `resumeSessionId`.
      security:
      - {}
      - leadTokenHeader: []
      - leadTokenCookie: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              properties:
                path:
                  anyOf:
                  - $ref: '#/components/schemas/OnboardingPathId'
                  - type: 'null'
                trackingSummary:
                  anyOf:
                  - $ref: '#/components/schemas/TrackingSummary'
                  - type: 'null'
                flowId:
                  anyOf:
                  - type: string
                  - type: 'null'
                  description: Browser-local flow id used before the server issues a session id.
                draftState:
                  anyOf:
                  - $ref: '#/components/schemas/OnboardingSession'
                  - type: 'null'
                resumeSessionId:
                  anyOf:
                  - type: string
                  - type: 'null'
                  description: Submitted onboarding session id to resume from Attio when no lead token is present.
                paymentPlanTier:
                  anyOf:
                  - type: string
                  - type: 'null'
                  description: Optional Stripe pricing-plan lookup key to assign to the onboarding session.
                email:
                  anyOf:
                  - type: string
                    format: email
                  - type: 'null'
                  description: Optional email seed for URL-driven onboarding links. Browser `/onboard?email=` links start a fresh local session unless `session` is also present.
                orgId:
                  anyOf:
                  - type: string
                  - type: 'null'
                  description: Optional prefixed provisioning org id, such as `photon:org_...`, used to link checkout/provisioning to an existing account.
                stripeCustomerId:
                  anyOf:
                  - type: string
                  - type: 'null'
                  description: Optional Stripe customer id seed, such as `cus_...`, stored as `stripe_customer_id` when the session is identified.
                leadToken:
                  type: string
                  description: Optional serialized lead token. Prefer the `x-onboarding-lead-token` header when available.
            example:
              path: clinic
              paymentPlanTier: launch
              email: lead@example.com
              orgId: photon:org_abc123
              stripeCustomerId: cus_abc123
              flowId: local-flow-id
              trackingSummary:
                source: agent
      responses:
        '200':
          $ref: '#/components/responses/OnboardingStateResponse'
  /api/onboarding/sessions/{sessionId}:
    patch:
      tags:
      - Onboarding
      operationId: saveOnboardingStep
      summary: Save or advance an onboarding step
      description: Persists step answers and, when advancing from contact details with a valid email, identifies the lead and syncs the Attio list item.
      security:
      - {}
      - leadTokenHeader: []
      - leadTokenCookie: []
      parameters:
      - name: sessionId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveStepRequest'
            example:
              stepId: contact
              action: advance
              values:
                email: admin@example.com
                first_name: Ada
                last_name: Lovelace
                company: Example Health
                job_title: CTO
              existingAnswers: {}
      responses:
        '200':
          $ref: '#/components/responses/OnboardingStateResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
  /api/onboarding/sessions/{sessionId}/submit:
    post:
      tags:
      - Onboarding
      operationId: submitOnboardingSession
      summary: Submit a completed onboarding session
      description: Validates all required path fields, marks the onboarding session submitted, syncs Attio, and returns a hosted Stripe Checkout URL for paid self-serve offers. Account provisioning happens from the Stripe webhook after payment.
      security:
      - {}
      - leadTokenHeader: []
      - leadTokenCookie: []
      parameters:
      - name: sessionId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitRequest'
            example:
              answers:
                email: admin@example.com
                first_name: Ada
                last_name: Lovelace
                company: Example Health
                app_domain: https://app.example.com
                integration_type:
                - api
                - embed
                tech_stack: React, Node, Postgres
                implementation_timeline: This quarter
                use_case: Embedded prescribing for a care team workflow.
      responses:
        '200':
          description: Submitted onboarding session.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: object
                    required:
                    - flow
                    - session
                    - leadToken
                    - answers
                    properties:
                      flow:
                        $ref: '#/components/schemas/OnboardingSession'
                      session:
                        $ref: '#/components/schemas/OnboardingSession'
                      leadToken:
                        type: string
                      answers:
                        $ref: '#/components/schemas/Answers'
                      checkoutUrl:
                        anyOf:
                        - type: string
                          format: uri
                        - type: 'null'
                      result:
                        anyOf:
                        - $ref: '#/components/schemas/ProvisioningResult'
                        - type: 'null'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '422':
          description: Validation failed. The response includes inline field errors and the step that needs attention.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorEnvelope'
components:
  responses:
    ErrorResponse:
      description: Request failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    OnboardingStateResponse:
      description: Current onboarding session state.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OnboardingStateEnvelope'
  schemas:
    OnboardingSchema:
      type: object
      required:
      - paths
      - allPaths
      - path
      - steps
      properties:
        paths:
          type: array
          items:
            $ref: '#/components/schemas/OnboardingPathChoice'
        allPaths:
          type: array
          items:
            $ref: '#/components/schemas/OnboardingFullPath'
        path:
          anyOf:
          - $ref: '#/components/schemas/OnboardingPathId'
          - type: 'null'
        steps:
          type: array
          items:
            $ref: '#/components/schemas/OnboardingStep'
    OnboardingMode:
      type: string
      enum:
      - self_serve
      - verification_required
      - sales_led
    OnboardingStateEnvelope:
      type: object
      required:
      - data
      properties:
        data:
          type: object
          required:
          - flow
          - session
          - leadToken
          - schema
          - answers
          properties:
            flow:
              $ref: '#/components/schemas/OnboardingSession'
            session:
              $ref: '#/components/schemas/OnboardingSession'
            leadToken:
              type: string
            schema:
              $ref: '#/components/schemas/OnboardingSchema'
            answers:
              $ref: '#/components/schemas/Answers'
            errors:
              type: object
              additionalProperties:
                type: string
            checkoutUrl:
              anyOf:
              - type: string
                format: uri
              - type: 'null'
            identityRestartRequired:
              type: boolean
            nextStep:
              type: string
    Answers:
      type: object
      additionalProperties:
        anyOf:
        - type: string
        - type: number
        - type: boolean
        - type: array
          items:
            type: string
        - type: 'null'
      example:
        email: name@example.com
        npi: 10-digit NPI
        first_name: First name
        last_name: Last name
        company: Practice name
        phone_number: (555) 555-1234
        fax_number: (555) 555-1234
        specialty: Psychiatry, Primary Care, Dermatology
        prescription_volume: 1-5 / month
        practice_type: Solo practice
        use_case: How do you expect to use Photon?
        prescribing_interface: DoseSpot
        prescribing_interface_other: Tell us what you use today
        address_street1: Practice street address
        address_street2: Suite or unit
        address_city: City
        address_state: AL
        address_postal_code: ZIP code
        job_title: Role or title
        app_domain: https://example.com
        integration_type:
        - app
        tech_stack: e.g. React, Node, Postgres
        implementation_timeline: Today
        care_model: Urgent care, pediatrics, weight loss, etc.
        provider_count: 1-5
        site_count: 1-10
        prescriber_count: 1-100
        pharmacy_services:
        - On-Site
        product_category: EHR, clinical workflow tool, care delivery platform
        customer_org_count: 1-10
        terms_of_service_accepted_at: '2026-05-25T12:00:00.000Z'
        business_associate_agreement_accepted_at: '2026-05-25T12:00:00.000Z'
    OnboardingPathId:
      type: string
      enum:
      - prescriber
      - developer
      - clinic
      - enterprise
      - platform
      - other
      description: Public onboarding path id. Prefer `/onboard?type={id}` for new human links. Legacy `/onboard#{id}` and `/onboard#{id}-{payment_plan_tier}` links remain supported.
    ErrorEnvelope:
      type: object
      required:
      - error
      properties:
        error:
          type: string
    TrackingSummary:
      type: object
      additionalProperties: true
      properties:
        source:
          type: string
        medium:
          type: string
        campaign:
          type: string
        referrer:
          type: string
        landingPath:
          type: string
    OnboardingFullPath:
      type: object
      required:
      - id
      - label
      - description
      - cta
      - mode
      - provisioningMode
      - entryPath
      - steps
      properties:
        id:
          $ref: '#/components/schemas/OnboardingPathId'
        label:
          type: string
        description:
          type: string
        cta:
          type: string
        mode:
          $ref: '#/components/schemas/OnboardingMode'
        provisioningMode:
          type: string
          enum:
          - developer
          - prescriber
          - handoff
        entryPath:
          type: string
        steps:
          type: array
          items:
            $ref: '#/components/schemas/OnboardingStep'
    OnboardingSession:
      type: object
      additionalProperties: true
      required:
      - sessionId
      - path
      - status
      - lastStep
      properties:
        sessionId:
          type: string
        path:
          anyOf:
          - $ref: '#/components/schemas/OnboardingPathId'
          - type: 'null'
        status:
          type: string
          enum:
          - draft
          - identified
          - submitted
        lastStep:
          type: string
        identifiedEmail:
          type: string
          format: email
        submittedAt:
          type: string
          format: date-time
        provisioningStatus:
          type: string
          enum:
          - pending
          - completed
          - failed
          - not_applicable
        paymentStatus:
          type: string
          enum:
          - not_required
          - payment_required
          - checkout_open
          - paid
          - failed
          - expired
        provisioningInviteUrl:
          type: string
          format: uri
        provisioningFailureReason:
          oneOf:
          - type: string
          - type: object
            properties:
              message:
                type: string
              debugMessage:
                type: string
        paymentPlanTier:
          type: string
          description: Business tier / Stripe pricing plan lookup key.
        paymentPlanName:
          type: string
          description: Display name returned by the billing catalog.
        paymentPlanDescription:
          type: string
          description: Short display description returned by the billing catalog.
        paymentPrice:
          type: number
          description: Monthly Checkout price in USD dollars.
        paymentIncludedMonthlyOrders:
          type: number
          description: Included monthly order volume for the plan.
        paymentOveragePrice:
          type: number
          description: Per-order overage price in USD dollars.
        stripeCustomerId:
          type: string
        stripeSubscriptionId:
          type: string
        attioEntryId:
          type: string
        attioPersonRecordId:
          type: string
    SaveStepRequest:
      type: object
      required:
      - stepId
      additionalProperties: false
      properties:
        stepId:
          type: string
        action:
          type: string
          enum:
          - save
          - advance
          default: save
        values:
          $ref: '#/components/schemas/Answers'
        existingAnswers:
          $ref: '#/components/schemas/Answers'
        draftState:
          anyOf:
          - $ref: '#/components/schemas/OnboardingSession'
          - type: 'null'
        leadToken:
          type: string
    OnboardingField:
      type: object
      required:
      - name
      - label
      - type
      properties:
        name:
          type: string
        label:
          type: string
        type:
          type: string
          enum:
          - email
          - multi-select
          - radio-cards
          - select
          - tel
          - text
          - textarea
          - url
        required:
          type: boolean
        options:
          type: array
          items:
            anyOf:
            - type: string
            - $ref: '#/components/schemas/OnboardingPathChoice'
        placeholder:
          type: string
        autoComplete:
          type: string
        inputMode:
          type: string
        showWhen:
          type: object
          additionalProperties: true
          properties:
            field:
              type: string
            value:
              type: string
    SubmitRequest:
      type: object
      additionalProperties: false
      properties:
        answers:
          $ref: '#/components/schemas/Answers'
        draftState:
          anyOf:
          - $ref: '#/components/schemas/OnboardingSession'
          - type: 'null'
        leadToken:
          type: string
        turnstileToken:
          type: string
          description: Cloudflare Turnstile token. Required when both Turnstile keys are configured.
    OnboardingPathChoice:
      type: object
      required:
      - id
      - label
      - description
      - cta
      - mode
      properties:
        id:
          $ref: '#/components/schemas/OnboardingPathId'
        label:
          type: string
        description:
          type: string
        cta:
          type: string
        mode:
          $ref: '#/components/schemas/OnboardingMode'
    OnboardingStep:
      type: object
      required:
      - id
      - title
      - fields
      properties:
        id:
          type: string
        title:
          type: string
        fields:
          type: array
          items:
            $ref: '#/components/schemas/OnboardingField'
    ValidationErrorEnvelope:
      type: object
      required:
      - data
      properties:
        data:
          type: object
          required:
          - flow
          - session
          - errors
          properties:
            flow:
              $ref: '#/components/schemas/OnboardingSession'
            session:
              $ref: '#/components/schemas/OnboardingSession'
            errors:
              type: object
              additionalProperties:
                type: string
            identityRestartRequired:
              type: boolean
            stepId:
              type: string
    ProvisioningResult:
      type: object
      additionalProperties: true
      properties:
        status:
          type: string
          enum:
          - completed
          - failed
          - handoff_required
          - pending
        message:
          type: string
        data:
          type: object
          additionalProperties: true
          properties:
            invite:
              type: object
              additionalProperties: true
              properties:
                id:
                  type: string
                email:
                  type: string
                  format: email
                url:
                  type: string
                  format: uri
  securitySchemes:
    leadTokenHeader:
      type: apiKey
      in: header
      name: x-onboarding-lead-token
    leadTokenCookie:
      type: apiKey
      in: cookie
      name: photon_onboarding_lead
externalDocs:
  description: Photon developer documentation
  url: https://docs.photon.health/docs
