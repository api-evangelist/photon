                  paths:
                  - id: prescriber
                    label: Prescriber
                    description: Start prescribing in the app
                    cta: Start Prescribing
                    mode: verification_required
                  - id: developer
                    label: Developer
                    description: Build and test in a sandbox
                    cta: Start Building
                    mode: self_serve
                  - id: clinic
                    label: Clinic
                    description: Launch prescribing in production
                    cta: Create Account
                    mode: sales_led
                  - id: enterprise
                    label: Enterprise
                    description: Large medical group or health system
                    cta: Talk to Sales
                    mode: sales_led
                  - id: platform
                    label: Platform
                    description: EHR or clinical platform
                    cta: Let's Partner
                    mode: sales_led
                  - id: other
                    label: Other
                    description: Tell us what you are looking for
                    cta: Get in Touch
                    mode: sales_led
                  allPaths:
                  - id: prescriber
                    label: Prescriber
                    description: Start prescribing in the app
                    cta: Start Prescribing
                    mode: verification_required
                    provisioningMode: prescriber
