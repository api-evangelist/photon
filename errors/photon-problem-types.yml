  title: Unauthorized
  detail: Missing or invalid onboarding lead token.
  remediation: >-
    Supply the x-onboarding-lead-token header (or the photon_onboarding_lead
    cookie) returned by createOrResumeOnboardingSession. Both are apiKey schemes
    and the session endpoints also accept anonymous access, so a 401 here means a
    token was sent and rejected rather than merely absent.
