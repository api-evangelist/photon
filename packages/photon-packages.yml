note: >-
  Currency re-read from the npm registry on 2026-08-14. Finding: Photon's two
  client SDKs are stale by years while the UI component library ships actively.
  @photonhealth/sdk last published 2024-09-06 and @photonhealth/react
  2023-12-14, but the GraphQL Clinical API they wrap gained 8 named types and a
  field deprecation since 2026-07-24 alone. An integrator installing the
  first-party SDK today gets a client that predates a large part of the schema
  it is meant to call.
