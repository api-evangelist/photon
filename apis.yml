name: Photon
kind: company
description: >-
  Photon Health is a United States prescription-infrastructure and e-prescribing
  (eRx) platform that lets digital-health companies embed prescribing, pharmacy
  selection, prescription routing, and fulfillment tracking into their clinical
  applications. Rather than an HL7 FHIR interface, Photon exposes a native
  GraphQL Clinical API - a single POST /graphql endpoint covering patients,
  prescriptions, orders, pharmacies, the medication/treatment catalog, drug-drug
  and drug-allergy screening, webhooks, and organization/user administration -
  plus a Patient Benefits API for pharmacy benefit checks and coverage. It also
  ships Photon Elements, prebuilt WebComponent UI for prescribing. The API is
  secured with OAuth2 client-credentials (Auth0) using machine-to-machine and
  user access tokens and prescription/order scopes; a sandbox runs on
  neutron.health. Photon serves prescribers and pharmacy-innovation partners
  including Amazon Pharmacy, Sesame, WeightWatchers, and Found.
