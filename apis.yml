apis:
- aid: photon:photon-clinical-api
  name: Photon Clinical API
  description: >-
    Photon's native GraphQL Clinical API for managing patients, prescriptions,
    orders, pharmacies, the treatment/medication catalog, drug-drug and
    drug-allergy interaction screening, webhooks, and organization/user
    administration. A single POST /graphql endpoint secured with OAuth2
    client-credentials (Auth0) bearer tokens. Schema harvested verbatim via
    unauthenticated GraphQL introspection.
  humanURL: https://docs.photon.health/reference/clinical-api
  baseURL: https://clinical-api.photon.health/graphql
  tags:
  - GraphQL
  - e-Prescribing
  - Pharmacy
