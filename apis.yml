- aid: photon:photon-patient-benefits-api
  name: Photon Patient Benefits API
  description: >-
    Photon's GraphQL Patient Benefits API for managing patient benefits and
    enabling pharmacy benefit checks (coverage options, copay, and formulary)
    during the prescribing workflow. Served over the same GraphQL endpoint via
    mutations such as createBenefit and generateCoverageOptions.
  humanURL: https://docs.photon.health/reference/patient-benefits-api
  baseURL: https://clinical-api.photon.health/graphql
  tags:
  - GraphQL
  - Benefit Check
  - Coverage
  properties:
